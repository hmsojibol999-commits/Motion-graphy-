name: remindme
description: Fully offline reminder app with full-screen alarms.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.4
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  share_plus: ^10.0.2
  cross_file: ^0.3.4+2
  flutter_animate: ^4.5.0
  vibration: ^2.0.0
  intl: any
  table_calendar: ^3.1.2
  uuid: ^4.4.2
  shared_preferences: ^2.3.2
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/
    - assets/fonts/
